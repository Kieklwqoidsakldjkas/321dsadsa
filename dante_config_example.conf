# Пример конфигурации dante для SOCKS5 прокси
# Файл: /etc/dante.conf

# Логирование
logoutput: syslog

# Пользователи
user.privileged: root
user.unprivileged: nobody

# Внутренний интерфейс (порт будет задан динамически)
internal: 0.0.0.0 port = 1080

# Внешний интерфейс
external.interface: 0.0.0.0

# Метод аутентификации для SOCKS
socksmethod: username

# Метод аутентификации для клиентов
clientmethod: none

# Правила для клиентов
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

# Правила для SOCKS
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: bind connect udpassociate
    log: error
    socksmethod: username
}

